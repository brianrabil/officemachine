packages:
  - "apps/*"
  - "apps/video-editor/frontend"
  - "packages/*"
  - "!apps/terminal/frontend"
  - "!apps/browser/frontend"
allowBuilds:
  "@google/genai": true
  "@mongodb-js/zstd": true
  "@swc/core": true
  cbor-extract: true
  esbuild: true
  node-liblzma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - files-sdk@2.1.0
  - "@fumadocs/base-ui@16.11.1"
  - "@fumadocs/tailwind@0.1.0"
  - fumadocs-core@16.11.1
  - fumadocs-mdx@15.1.0
  - "@remotion/licensing@4.0.487"
  - "@remotion/media@4.0.487"
  - "@remotion/player@4.0.487"
  - "@remotion/web-renderer@4.0.487"
  - "remotion@4.0.487"
  - "@ai-sdk/*"
  - "@rolldown/*"
  - "@vercel/*"
  - "@workflow/*"
  - ai
  - experimental-ai-sdk-code-mode
  - eve
  - nitro
  - rolldown
  - workflow
