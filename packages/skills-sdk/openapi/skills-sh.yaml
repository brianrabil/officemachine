openapi: 3.0.3
info:
  title: skills.sh API
  version: v1
  description: >-
    Hand-authored spec for the official skills.sh API
    (https://skills.sh/docs/api). Vercel does not publish a machine-readable
    OpenAPI/Swagger document for this API, so this file mirrors the
    documented REST reference and is kept in sync manually. See the
    `packages/skills-sdk:sync-openapi-spec` skill for the re-sync procedure.
externalDocs:
  description: skills.sh API reference (source of truth for this spec)
  url: https://skills.sh/docs/api
servers:
  - url: https://skills.sh
security:
  - vercelOidcBearer: []
  - vercelOidcHeader: []
paths:
  /api/v1/skills:
    get:
      operationId: listSkills
      summary: Paginated leaderboard of all skills.
      description: >-
        Cache-Control caches this response for roughly 30-60 seconds.
        Authenticated requests are rate-limited to 600/min per (team,
        project); see the X-RateLimit-* response headers.
      parameters:
        - name: view
          in: query
          description: >-
            Leaderboard ordering. "all-time" ranks by total installs,
            "trending" surfaces recent growth, and "hot" ranks by installs in
            the last 24 hours (adds installsYesterday/change to each result).
          schema:
            $ref: '#/components/schemas/ListSkillsView'
            default: all-time
        - name: page
          in: query
          description: 0-indexed page number.
          schema:
            type: integer
            default: 0
        - name: per_page
          in: query
          description: Number of results to return per page.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: Paginated leaderboard of all skills.
          headers:
            X-RateLimit-Limit:
              schema: { type: integer }
              description: Requests allowed per window.
            X-RateLimit-Remaining:
              schema: { type: integer }
              description: Requests remaining in the current window.
            X-RateLimit-Reset:
              schema: { type: integer }
              description: Unix timestamp when the window resets.
            Cache-Control:
              schema: { type: string }
              description: e.g. "public, s-maxage=30-60".
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
              example:
                data:
                  - id: vercel-labs/skills/find-skills
                    slug: find-skills
                    name: find-skills
                    source: vercel-labs/skills
                    installs: 24531
                    sourceType: github
                    installUrl: https://github.com/vercel-labs/skills
                    url: https://skills.sh/vercel-labs/skills/find-skills
                pagination:
                  page: 0
                  perPage: 10
                  total: 8420
                  hasMore: true
        '401':
          description: Missing, invalid, or expired Vercel OIDC token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '429':
          description: Rate limit exceeded. Retry after the Retry-After interval.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedResponse'
        '503':
          description: Temporarily unavailable. Retry with backoff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnavailableResponse'

  /api/v1/skills/search:
    get:
      operationId: searchSkills
      summary: Search skills by name or description.
      description: >-
        Single-word queries use fuzzy matching; multi-word queries use
        semantic search (see searchType in the response). Cache-Control
        caches this response for roughly 30-60 seconds. Authenticated
        requests are rate-limited to 600/min per (team, project).
      parameters:
        - name: q
          in: query
          required: true
          description: >-
            Search query. Minimum 2 characters. Single words use fuzzy
            matching; multi-word queries use semantic search.
          schema:
            type: string
            minLength: 2
        - name: limit
          in: query
          description: Maximum number of results to return.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: owner
          in: query
          description: >-
            GitHub owner to search within. Includes skills across all of its
            repositories.
          schema:
            type: string
      responses:
        '200':
          description: Search skills by name or description.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
              example:
                data:
                  - id: vercel-labs/skills/find-skills
                    slug: find-skills
                    name: find-skills
                    source: vercel-labs/skills
                    installs: 24531
                    sourceType: github
                    installUrl: https://github.com/vercel-labs/skills
                    url: https://skills.sh/vercel-labs/skills/find-skills
                query: find skills
                searchType: fuzzy
                count: 1
                durationMs: 12
        '400':
          description: Invalid request parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponse'
        '401':
          description: Missing, invalid, or expired Vercel OIDC token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '429':
          description: Rate limit exceeded. Retry after the Retry-After interval.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedResponse'
        '503':
          description: Temporarily unavailable. Retry with backoff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnavailableResponse'

  /api/v1/skills/curated:
    get:
      operationId: getCuratedSkills
      summary: The official curated set of first-party skills.
      description: >-
        Grouped by owner. Cache-Control caches this response for roughly 5
        minutes. Authenticated requests are rate-limited to 600/min per
        (team, project).
      responses:
        '200':
          description: The official curated set of first-party skills.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CuratedResponse'
        '401':
          description: Missing, invalid, or expired Vercel OIDC token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '429':
          description: Rate limit exceeded. Retry after the Retry-After interval.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedResponse'
        '503':
          description: Temporarily unavailable. Retry with backoff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnavailableResponse'

  /api/v1/skills/{id}:
    get:
      operationId: getSkill
      summary: Detailed information about a single skill.
      description: >-
        Use the id field from any listing, search, or curated response to
        construct this path — it is the full "{source}/{slug}" string and
        may itself contain slashes, so treat it as one opaque path segment
        rather than two. Cache-Control caches this response for roughly 5
        minutes. Authenticated requests are rate-limited to 600/min per
        (team, project).
      parameters:
        - name: id
          in: path
          required: true
          description: >-
            "{source}/{slug}", e.g. "vercel-labs/skills/find-skills" (GitHub)
            or "mintlify.com/mintlify" (well-known). May contain slashes.
          schema:
            type: string
      responses:
        '200':
          description: Detailed information about a single skill.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
        '401':
          description: Missing, invalid, or expired Vercel OIDC token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '404':
          description: Skill not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '429':
          description: Rate limit exceeded. Retry after the Retry-After interval.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedResponse'
        '503':
          description: Temporarily unavailable. Retry with backoff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnavailableResponse'

  /api/v1/skills/audit/{id}:
    get:
      operationId: getSkillAudit
      summary: Security audit results for a skill.
      description: >-
        Aggregates findings from partner scanners (Gen Agent Trust Hub,
        Socket, Snyk, Runlayer, ZeroLeaks). Returns 404 if no audits exist
        yet for the given skill. Authenticated requests are rate-limited to
        600/min per (team, project).
      parameters:
        - name: id
          in: path
          required: true
          description: >-
            "{source}/{slug}", e.g. "vercel-labs/skills/find-skills" (GitHub)
            or "mintlify.com/mintlify" (well-known). May contain slashes.
          schema:
            type: string
      responses:
        '200':
          description: Security audit results for a skill.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditResponse'
              example:
                id: vercel-labs/skills/find-skills
                source: vercel-labs/skills
                slug: find-skills
                audits:
                  - provider: Gen Agent Trust Hub
                    slug: agent-trust-hub
                    status: pass
                    summary: No risks detected
                    auditedAt: '2026-04-15T12:00:00.000Z'
                    riskLevel: LOW
        '401':
          description: Missing, invalid, or expired Vercel OIDC token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedResponse'
        '404':
          description: No audits exist yet for this skill.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponse'
        '429':
          description: Rate limit exceeded. Retry after the Retry-After interval.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitedResponse'
        '503':
          description: Temporarily unavailable. Retry with backoff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnavailableResponse'

components:
  securitySchemes:
    vercelOidcBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Vercel OIDC token. Obtain via getVercelOidcToken() from @vercel/oidc,
        or read process.env.VERCEL_OIDC_TOKEN directly. Pass it as the
        Authorization header on every request. Requires OIDC Federation to
        be enabled in the Vercel project settings; locally, run `vercel
        link` and `vercel env pull` to obtain a token. This SDK does not
        inject the header automatically — pass it via the fetch `options`
        argument on each call.
    vercelOidcHeader:
      type: apiKey
      in: header
      name: x-vercel-oidc-token
      description: >-
        Alternative to the Authorization header — pass the Vercel OIDC token
        directly in this header.

  schemas:
    ListSkillsView:
      type: string
      description: >-
        "all-time" (default) ranks by total installs, "trending" surfaces
        recent growth, "hot" ranks by installs in the last 24 hours.
      enum:
        - all-time
        - trending
        - hot

    SkillSourceType:
      type: string
      description: >-
        "github" for skills hosted in a GitHub repository, "well-known" for
        skills published via a domain's .well-known directory.
      enum:
        - github
        - well-known

    Skill:
      type: object
      description: Summary shape used in listing, search, and curated responses.
      required:
        - id
        - slug
        - name
        - source
        - installs
        - sourceType
        - installUrl
        - url
      properties:
        id:
          type: string
          description: >-
            Stable unique identifier. Format "{source}/{slug}". Pass this
            verbatim as the `id` path parameter to the detail and audit
            endpoints.
        slug:
          type: string
          description: Skill slug, unique within its source.
        name:
          type: string
          description: Human-readable skill name.
        source:
          type: string
          description: >-
            GitHub "owner/repo" or well-known "domain.com" this skill was
            published from.
        installs:
          type: integer
          description: Total install count.
        sourceType:
          $ref: '#/components/schemas/SkillSourceType'
        installUrl:
          type: string
          nullable: true
          description: >-
            Installable via `npx skills add {installUrl}`. Null when the
            skill has no direct install target.
        url:
          type: string
          description: Canonical skills.sh page for this skill.
        isDuplicate:
          type: boolean
          description: >-
            True when this entry duplicates another skill's content.
            Omitted (not false) when not a duplicate — filter these out to
            show only original skills.
        installsYesterday:
          type: integer
          description: Installs in the last 24 hours. Only present when view=hot.
        change:
          type: integer
          description: Day-over-day change in installs. Only present when view=hot.

    Pagination:
      type: object
      properties:
        page:
          type: integer
          description: 0-indexed current page.
        perPage:
          type: integer
          description: Results per page, as requested (or its default/clamped value).
        total:
          type: integer
          description: Total number of matching skills across all pages.
        hasMore:
          type: boolean
          description: True when a subsequent page exists.
      required:
        - page
        - perPage
        - total
        - hasMore

    ListResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Skill'
        pagination:
          $ref: '#/components/schemas/Pagination'

    SearchResponseSearchType:
      type: string
      description: >-
        "fuzzy" for single-word queries matched by name/source, "semantic"
        for multi-word queries matched by meaning.
      enum:
        - fuzzy
        - semantic

    SearchResponse:
      type: object
      required:
        - data
        - query
        - searchType
        - count
        - durationMs
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Skill'
        query:
          type: string
          description: Echoes the `q` query parameter.
        searchType:
          $ref: '#/components/schemas/SearchResponseSearchType'
        count:
          type: integer
          description: Number of results in `data`.
        durationMs:
          type: integer
          description: Server-side search time in milliseconds.

    CuratedGroup:
      type: object
      description: One owner's curated skills, with aggregate stats.
      required:
        - owner
        - totalInstalls
        - featuredRepo
        - featuredSkill
        - skills
      properties:
        owner:
          type: string
          description: GitHub owner (organization or user) this group belongs to.
        totalInstalls:
          type: integer
          description: Sum of installs across all of this owner's curated skills.
        featuredRepo:
          type: string
          description: The owner's most prominent repository in this curated set.
        featuredSkill:
          type: string
          description: The owner's most prominent skill slug in this curated set.
        skills:
          type: array
          items:
            $ref: '#/components/schemas/Skill'

    CuratedResponse:
      type: object
      required:
        - data
        - totalOwners
        - totalSkills
        - generatedAt
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CuratedGroup'
        totalOwners:
          type: integer
          description: Number of curated owner groups in `data`.
        totalSkills:
          type: integer
          description: Total number of curated skills across all groups.
        generatedAt:
          type: string
          format: date-time
          description: When this curated snapshot was generated.

    DetailFile:
      type: object
      description: One file belonging to a skill (SKILL.md or a supporting file).
      required:
        - path
        - contents
      properties:
        path:
          type: string
          description: File path relative to the skill's root directory.
        contents:
          type: string
          description: Raw file contents.

    Detail:
      type: object
      required:
        - id
        - source
        - slug
        - installs
        - hash
        - files
      properties:
        id:
          type: string
          description: Stable unique identifier. Format "{source}/{slug}".
        source:
          type: string
          description: >-
            GitHub "owner/repo" or well-known "domain.com" this skill was
            published from.
        slug:
          type: string
          description: Skill slug, unique within its source.
        installs:
          type: integer
          description: Total install count.
        hash:
          type: string
          nullable: true
          description: >-
            SHA-256 hex digest of the concatenated file contents. Null if
            not yet computed.
        files:
          type: array
          nullable: true
          description: >-
            SKILL.md plus any supporting files. Null if the skill's content
            could not be fetched.
          items:
            $ref: '#/components/schemas/DetailFile'

    AuditEntryStatus:
      type: string
      description: Overall verdict from this audit partner.
      enum:
        - pass
        - warn
        - fail

    AuditEntryRiskLevel:
      type: string
      description: Severity of the highest-risk finding, when applicable.
      enum:
        - NONE
        - LOW
        - MEDIUM
        - HIGH
        - CRITICAL

    AuditEntry:
      type: object
      description: One partner's audit result for a skill.
      required:
        - provider
        - slug
        - status
        - summary
        - auditedAt
      properties:
        provider:
          type: string
          description: >-
            Audit partner display name, e.g. "Gen Agent Trust Hub",
            "Socket", "Snyk", "Runlayer", "ZeroLeaks".
        slug:
          type: string
          description: Machine-readable partner identifier.
        status:
          $ref: '#/components/schemas/AuditEntryStatus'
        summary:
          type: string
          description: One-line human-readable finding.
        auditedAt:
          type: string
          format: date-time
          description: When this partner last audited the skill.
        riskLevel:
          $ref: '#/components/schemas/AuditEntryRiskLevel'
        categories:
          type: array
          description: Detected risk categories, when the partner reports them.
          items:
            type: string

    AuditResponse:
      type: object
      required:
        - id
        - source
        - slug
        - audits
      properties:
        id:
          type: string
          description: Stable unique identifier. Format "{source}/{slug}".
        source:
          type: string
          description: >-
            GitHub "owner/repo" or well-known "domain.com" this skill was
            published from.
        slug:
          type: string
          description: Skill slug, unique within its source.
        audits:
          type: array
          description: One entry per partner that has audited this skill.
          items:
            $ref: '#/components/schemas/AuditEntry'

    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Machine-readable error code.
        message:
          type: string
          description: Human-readable description of the error.

    BadRequestResponse:
      description: Invalid request parameters.
      allOf:
        - $ref: '#/components/schemas/Error'

    UnauthorizedResponse:
      description: Missing, invalid, or expired Vercel OIDC token.
      allOf:
        - $ref: '#/components/schemas/Error'

    NotFoundResponse:
      description: Skill not found.
      allOf:
        - $ref: '#/components/schemas/Error'

    RateLimitedResponse:
      description: Rate limit exceeded. Retry after the Retry-After interval.
      allOf:
        - $ref: '#/components/schemas/Error'

    UnavailableResponse:
      description: Temporarily unavailable. Retry with backoff.
      allOf:
        - $ref: '#/components/schemas/Error'
